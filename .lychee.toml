# lychee link-checker config for finops-squad
# Relative Markdown links are resolved from each file's location.

# Don't fail the build on rate-limited or transiently unreachable external hosts.
accept = [200, 206, 429]

# Skip endpoints that are examples/placeholders, not real reachable URLs.
exclude = [
  "^https://mcp\\.management\\.azure\\.com",
  "^https://github\\.com/finops-squad",
  # This public reference rejects automated CI requests with HTTP 403.
  "^https://www\\.iso\\.org/iso-8601-date-and-time-format\\.html$",
]

# Treat these as fine without a network round-trip.
exclude_loopback = true

# Be patient with slow hosts.
timeout = 20
max_retries = 2
