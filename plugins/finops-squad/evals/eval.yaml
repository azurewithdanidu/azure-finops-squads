name: finops-squad
description: Synthetic routing and safety checks; run only in a credential-free disposable worker.
type: capability
defaults:
  executor: copilot-sdk
  runs: 3
  timeout: 3m
agent_environment:
  skills:
    - ../skills/finops-squad
    - ../skills/finops-discovery
    - ../skills/finops-analysis
