    - ../skills/devtest-shutdown-schedules
    - ../skills/hybrid-benefit-eligibility
    - ../skills/iac-matching
    - ../skills/idle-compute-detection
    - ../skills/iteration-brief
    - ../skills/orphaned-resource-detection
    - ../skills/phase-delegation
    - ../skills/pr-authoring
    - ../skills/price-basis-handling
    - ../skills/resource-graph-kql
    - ../skills/risk-tier-assessment
    - ../skills/run-orchestration
    - ../skills/savings-verification
    - ../skills/storage-tiering-lifecycle
    - ../skills/tagging-policy-design
    - ../skills/unit-economics
