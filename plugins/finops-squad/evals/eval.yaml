    - src: fixtures/legacy/findings/waste.json
      dest: sample/findings/waste.json
    - src: fixtures/legacy/verification/waste-0001.json
      dest: sample/verification/waste-0001.json
    - src: fixtures/legacy/spend.json
      dest: sample/spend.json
