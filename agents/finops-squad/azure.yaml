# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

requiredVersions:
    azd: '>=1.27.1'
    extensions:
        azure.ai.agents: '>=1.0.0-beta.9'
name: finops-squad
services:
    ai-project:
        host: azure.ai.project
        deployments: []
        endpoint: https://danidu-agentic-migrations.services.ai.azure.com/api/projects/danidu-agentic-migrations
    finops-discovery:
        project: src/finops_agent
        host: azure.ai.agent
        language: python
        uses:
            - ai-project
        env:
            AGENT_ROLE: discovery
            AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
            FINOPS_STORAGE_ACCOUNT_URL: ${FINOPS_STORAGE_ACCOUNT_URL}
            FINOPS_STORAGE_CONTAINER: finops
            SKILL_NAMES: resource-graph-kql,cost-query-patterns,advisor-cost-recommendations,price-basis-handling
        codeConfiguration:
            dependencyResolution: remote_build
            entryPoint: main.py
            runtime: python_3_13
        container:
            resources:
                cpu: "0.5"
                memory: 1Gi
        description: FinOps Discovery - inventories subscriptions, spend and Advisor cost recommendations (read-only).
        kind: hosted
        name: finops-discovery
        protocols:
            - protocol: responses
              version: 2.0.0
    finops-analyser:
        project: src/finops_agent
        host: azure.ai.agent
        language: python
        uses:
            - ai-project
        env:
            AGENT_ROLE: analyser
            AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
            FINOPS_STORAGE_ACCOUNT_URL: ${FINOPS_STORAGE_ACCOUNT_URL}
            FINOPS_STORAGE_CONTAINER: finops
        codeConfiguration:
            dependencyResolution: remote_build
            entryPoint: main.py
            runtime: python_3_13
        container:
            resources:
                cpu: "0.5"
                memory: 1Gi
        description: FinOps Analyser - waste, rightsizing, tagging, commitment, anomaly and verify modes (read-only).
        kind: hosted
        name: finops-analyser
        protocols:
            - protocol: responses
              version: 2.0.0
    finops-visualizer:
        project: src/finops_agent
        host: azure.ai.agent
        language: python
        uses:
            - ai-project
        env:
            AGENT_ROLE: visualizer
            AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
            FINOPS_STORAGE_ACCOUNT_URL: ${FINOPS_STORAGE_ACCOUNT_URL}
            FINOPS_STORAGE_CONTAINER: finops
        codeConfiguration:
            dependencyResolution: remote_build
            entryPoint: main.py
            runtime: python_3_13
        container:
            resources:
                cpu: "0.5"
                memory: 1Gi
        description: FinOps Visualizer - executive summary, engineer backlog, savings ledger and KPIs from run artifacts.
        kind: hosted
        name: finops-visualizer
        protocols:
            - protocol: responses
              version: 2.0.0
    finops-implementer:
        project: src/finops_agent
        host: azure.ai.agent
        language: python
        uses:
            - ai-project
        env:
            AGENT_ROLE: implementer
            AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
            FINOPS_STORAGE_ACCOUNT_URL: ${FINOPS_STORAGE_ACCOUNT_URL}
            FINOPS_STORAGE_CONTAINER: finops
        codeConfiguration:
            dependencyResolution: remote_build
            entryPoint: main.py
            runtime: python_3_13
        container:
            resources:
                cpu: "0.5"
                memory: 1Gi
        description: FinOps Implementer - drafts Bicep changes and PR bodies for approved findings; refuses T3/untiered.
        kind: hosted
        name: finops-implementer
        protocols:
            - protocol: responses
              version: 2.0.0
infra:
    provider: microsoft.foundry
