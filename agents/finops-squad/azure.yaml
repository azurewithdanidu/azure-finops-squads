# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

requiredVersions:
    azd: '>=1.27.1'
    extensions:
        azure.ai.agents: '>=1.0.0-beta.9'
name: finops-squad
services:
    finops-discovery:
        project: src/finops_agent
        host: azure.ai.agent
        language: python
        uses:
            - ai-project
        env:
            AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
            AGENT_ROLE: discovery
            SKILL_NAMES: resource-graph-kql,cost-query-patterns,advisor-cost-recommendations,price-basis-handling
            FINOPS_STORAGE_ACCOUNT_URL: ${FINOPS_STORAGE_ACCOUNT_URL}
            FINOPS_STORAGE_CONTAINER: finops
        codeConfiguration:
            dependencyResolution: remote_build
            entryPoint: main.py
            runtime: python_3_13
        container:
            resources:
                cpu: "0.5"
                memory: 1Gi
        description: FinOps Discovery - inventories subscriptions, spend and Advisor cost recommendations (read-only).
        kind: hosted
        name: finops-discovery
        protocols:
            - protocol: responses
              version: 2.0.0
    ai-project:
        host: azure.ai.project
        deployments:
            - model:
                format: OpenAI
                name: gpt-4.1
                version: "2025-04-14"
              name: gpt-4.1
              sku:
                capacity: 10
                name: GlobalStandard
infra:
    provider: microsoft.foundry
