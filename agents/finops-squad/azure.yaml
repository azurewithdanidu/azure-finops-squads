# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

requiredVersions:
    azd: '>=1.27.1'
    extensions:
        azure.ai.agents: '>=1.0.0-beta.9'
name: finops-squad
services:
    ai-project:
        host: azure.ai.project
        deployments: []
        endpoint: https://danidu-agentic-migrations.services.ai.azure.com/api/projects/danidu-agentic-migrations
    finops-squad:
        project: src/finops_agent
        host: azure.ai.agent
        language: python
        uses:
            - ai-project
        env:
            AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
            FINOPS_STORAGE_ACCOUNT_URL: ${FINOPS_STORAGE_ACCOUNT_URL}
            FINOPS_STORAGE_CONTAINER: finops
        codeConfiguration:
            dependencyResolution: remote_build
            entryPoint: main.py
            runtime: python_3_13
        container:
            resources:
                cpu: "1"
                memory: 2Gi
        description: FinOps Squad - single agent that discovers, analyses, reports and drafts remediation, read-only on Azure, with all FinOps skills.
        kind: hosted
        name: finops-squad
        protocols:
            - protocol: responses
              version: 2.0.0
infra:
    provider: microsoft.foundry
