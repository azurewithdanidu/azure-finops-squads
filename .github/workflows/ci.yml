name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Schema validation & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt
      - name: Validate fixtures against schemas
        run: python -B plugins/finops-squad/skills/finops-squad/scripts/validate-findings.py plugins/finops-squad/evals/fixtures/legacy/
      - name: Validate Discovery output shape (complete fixture, strict)
        run: python -B plugins/finops-squad/skills/finops-squad/scripts/validate_discovery.py tests/fixtures/discovery/complete --strict
      - name: Run unit tests
        run: python -m pytest tests/ -q
      - uses: actions/checkout@v4
        with:
          repository: azurewithdanidu/agentz
          ref: 56ec88a6633fab7a3776a41806b4addf80f9fe42
          path: .agentz-tooling
          persist-credentials: false
      - name: Check generated plugin definitions and marketplace structure
        run: python scripts/plugin_tools.py --agentz-root .agentz-tooling
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Lint plugin evaluations
        run: npx -y @microsoft/vally-cli@0.20.0 lint plugins/finops-squad/skills --eval-spec plugins/finops-squad/evals/eval.yaml

  markdownlint:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          globs: |
            **/*.md
            !**/node_modules/**
            !.agentz-tooling/**

  linkcheck:
    name: Link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --config .lychee.toml
            "**/*.md"
            --exclude-path .agentz-tooling
          fail: true
